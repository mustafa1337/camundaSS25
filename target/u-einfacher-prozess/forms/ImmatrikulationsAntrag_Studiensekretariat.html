<meta http-equiv="content-type" content="text/html; charset=utf-8">
<h2>Überprüfung des Immatrikulationsantrags – Studiensekretariat</h2>

<form role="form" name="variablesForm" class="form-horizontal">

  <fieldset>
    <legend>1. Persönliche Angaben</legend>

    <div class="form-group">
      <label>Nachname</label>
      <input type="text" cam-variable-name="nachname" cam-variable-type="String"
             class="form-control" readonly />
    </div>

    <div class="form-group">
      <label>Vorname(n)</label>
      <input type="text" cam-variable-name="vorname" cam-variable-type="String"
             class="form-control" readonly />
    </div>

    <div class="form-group">
      <label>Geburtsdatum</label>
      <input type="text" cam-variable-name="geburtsdatum" cam-variable-type="String"
             class="form-control" readonly />
    </div>

    <div class="form-group">
      <label>Geburtsort</label>
      <input type="text" cam-variable-name="geburtsort" cam-variable-type="String"
             class="form-control" readonly />
    </div>

    <div class="form-group">
      <label>Staatsangehörigkeit</label>
      <input type="text" cam-variable-name="staatsangehoerigkeit" cam-variable-type="String"
             class="form-control" readonly />
    </div>

    <div class="form-group">
      <label>Adresse</label>
      <textarea cam-variable-name="adresse" cam-variable-type="String"
                class="form-control" readonly></textarea>
    </div>

    <div class="form-group">
      <label>E-Mail</label>
      <input type="text" cam-variable-name="email" cam-variable-type="String"
             class="form-control" readonly />
    </div>

    <div class="form-group">
      <label>Telefonnummer</label>
      <input type="text" cam-variable-name="telefonnummer" cam-variable-type="String"
             class="form-control" readonly />
    </div>
  </fieldset>

  <fieldset>
    <legend>2. Studienwunsch</legend>

    <div class="form-group">
      <label>Studiengang</label>
      <input type="text" cam-variable-name="studiengang" cam-variable-type="String"
             class="form-control" readonly />
    </div>

    <div class="form-group">
      <label>Angestrebter Abschluss</label>
      <input type="text" cam-variable-name="abschluss" cam-variable-type="String"
             class="form-control" readonly />
    </div>

    <div class="form-group">
      <label>Hochschulsemester</label>
      <input type="text" cam-variable-name="hochschulsemester" cam-variable-type="Integer"
             class="form-control" readonly />
    </div>
  </fieldset>

  <fieldset>
    <legend>3. Nachweise</legend>

	<div class="form-group">
	  <label>HZB (Zeugnis – Dateiname)</label>
	  <input type="text" cam-variable-name="hzb_zeugnis_name"
	         cam-variable-type="String" class="form-control" readonly />
	</div>
	
	<div class="form-group">
	  <label>Krankenversicherungsnachweis (Dateiname)</label>
	  <input type="text" cam-variable-name="krankenversicherung_name"
	         cam-variable-type="String" class="form-control" readonly />
	</div>

  </fieldset>

  <fieldset>
    <legend>4. Überprüfung durch das Sekretariat</legend>

    <div class="form-group">
      <label>Unterlagen vollständig?</label>
      <select cam-variable-name="unterlagen_vollstaendig"
              cam-variable-type="Boolean"
              class="form-control" required>
        <option value="">-- Bitte auswählen --</option>
        <option value="true">Ja</option>
        <option value="false">Nein</option>
      </select>
    </div>

    <div class="form-group">
      <label>Kommentar (optional)</label>
      <textarea cam-variable-name="kommentar"
                cam-variable-type="String"
                class="form-control"></textarea>
    </div>

    </div>
  </fieldset>

  <script cam-script type="text/form-script">
  </script>

</form>
