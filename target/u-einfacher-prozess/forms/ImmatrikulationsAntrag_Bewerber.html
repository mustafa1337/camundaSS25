<meta http-equiv="content-type" content="text/html; charset=utf-8">
<h2>Immatrikulationsantrag – Universität</h2>

<form role="form" name="variablesForm" class="form-horizontal">

  <fieldset>
    <legend>1. Persönliche Angaben</legend>

    <div class="form-group">
      <label>Nachname *</label>
      <input type="text" cam-variable-name="nachname" cam-variable-type="String" class="form-control" required />
    </div>

    <div class="form-group">
      <label>Vorname(n) *</label>
      <input type="text" cam-variable-name="vorname" cam-variable-type="String" class="form-control" required />
    </div>

    <div class="form-group">
      <label>Geburtsdatum * (JJJJ-MM-TT)</label>
      <input type="text" cam-variable-name="geburtsdatum" cam-variable-type="String" class="form-control" required />
    </div>

    <div class="form-group">
      <label>Geburtsort *</label>
      <input type="text" cam-variable-name="geburtsort" cam-variable-type="String" class="form-control" required />
    </div>

    <div class="form-group">
      <label>Staatsangehörigkeit *</label>
      <input type="text" cam-variable-name="staatsangehoerigkeit" cam-variable-type="String" class="form-control" required />
    </div>

    <div class="form-group">
      <label>Adresse *</label>
      <textarea cam-variable-name="adresse" cam-variable-type="String" class="form-control" required></textarea>
    </div>

    <div class="form-group">
      <label>E-Mail-Adresse *</label>
      <input type="text" cam-variable-name="email" cam-variable-type="String" class="form-control" required />
    </div>

    <div class="form-group">
      <label>Telefonnummer *</label>
      <input type="text" cam-variable-name="telefonnummer" cam-variable-type="String" class="form-control" required />
    </div>
  </fieldset>

  <fieldset>
    <legend>2. Studienwunsch</legend>

    <div class="form-group">
      <label>Gewünschter Studiengang *</label>
      <select cam-variable-name="studiengang_id" cam-variable-type="String" cam-choices="ALLE_STUDIENGAENGE" class="form-control">
      </select>
    </div>

    <div class="form-group">
      <label>Angestrebter Abschluss *</label>
      <select cam-variable-name="abschluss" cam-variable-type="String" class="form-control" required>
        <option value="">-- Bitte auswählen --</option>
        <option value="Bachelor">Bachelor</option>
        <option value="Master">Master</option>
        <option value="Staatsexamen">Staatsexamen</option>
      </select>
    </div>

    <div class="form-group">
      <label>Hochschulsemester *</label>
      <input type="number" cam-variable-name="hochschulsemester" cam-variable-type="Integer" min="1" class="form-control" required />
    </div>
  </fieldset>

  <fieldset>
    <legend>3. Nachweise / Dokumente</legend>

    <div class="form-group">
      <label>Hochschulzugangsberechtigung (HZB) *</label>
      <input type="file" id="hzbInput" class="form-control" />
    </div>

    <div class="form-group">
      <label>Krankenversicherungsnachweis *</label>
      <input type="file" id="krankenInput" class="form-control" />
    </div>
  </fieldset>

  <p><small>* Pflichtfeld</small></p>

  <script cam-script type="text/form-script">
    camForm.on('submit', function(evt) {
      var hzbFile = document.getElementById('hzbInput').files[0];
      if (hzbFile) {
        camForm.variableManager.createVariable({
          name: 'hzb_zeugnis_name',
          type: 'String',
          value: hzbFile.name
        });
      }

      var krankFile = document.getElementById('krankenInput').files[0];
      if (krankFile) {
        camForm.variableManager.createVariable({
          name: 'krankenversicherung_name',
          type: 'String',
          value: krankFile.name
        });
      }
    });
  </script>

</form>
